# nginx proxy address - http://172.17.0.1:64186

name: gitlab
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    shm_size: 4g
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://${BASE_HOST_NAME:-$HOSTNAME}:64186'
        gitlab_rails['time_zone'] = '${TZ:-America/New_York}'
        gitlab_rails['initial_root_password'] = '${APP_ADMIN_PASS:-replace-with-a-random-password}'
        gitlab_rails['smtp_enable'] = true
        gitlab_rails['smtp_address'] = '${EMAIL_SERVER_HOST:-172.17.0.1}'
        gitlab_rails['smtp_port'] = ${EMAIL_SERVER_PORT:-587}
        gitlab_rails['smtp_user_name'] = '${EMAIL_SERVER_LOGIN_NAME:-}'
        gitlab_rails['smtp_password'] = '${EMAIL_SERVER_LOGIN_PASS:-}'
        gitlab_rails['smtp_domain'] = '${BASE_DOMAIN_NAME:-example.com}'
        gitlab_rails['smtp_enable_starttls_auto'] = true
        gitlab_rails['gitlab_email_from'] = '${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}'
        gitlab_rails['gitlab_email_reply_to'] = '${EMAIL_SERVER_MAIL_FROM:-noreply@example.com}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
      CONTAINER_NAME: gitlab-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    ports:
      - '172.17.0.1:64186:80'
      - '2224:22'
    volumes:
      - './volumes/config/gitlab:/etc/gitlab'
      - './volumes/logs/gitlab:/var/log/gitlab'
      - './volumes/data/gitlab:/var/opt/gitlab'
    healthcheck:
      test: ['CMD-SHELL', '/opt/gitlab/bin/gitlab-healthcheck --fail --max-time 10']
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 300s
    networks:
      - gitlab

networks:
  gitlab:
    name: gitlab
    external: false
